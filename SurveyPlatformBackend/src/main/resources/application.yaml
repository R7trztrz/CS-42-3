spring:
  application:
    name: SurveyPlatformBackend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 5MB
      # Allow multipart framing overhead beyond the single-file limit.
      max-request-size: 6MB

security:
  jwt:
    secret: ${JWT_SECRET}

turnstile:
  secret: ${TURNSTILE_SECRET:}

app:
  participant-base-url: ${APP_PARTICIPANT_BASE_URL:http://localhost:5173}
  participation:
    inactivity-timeout: ${PARTICIPANT_INACTIVITY_TIMEOUT:30m}
    timeout-scan-interval: ${PARTICIPANT_TIMEOUT_SCAN_INTERVAL:1m}
    max-device-info-bytes: ${PARTICIPANT_MAX_DEVICE_INFO_BYTES:4096}
    consent-document-version: ${PARTICIPANT_CONSENT_DOCUMENT_VERSION:platform-default-v1}
  assets:
    storage-directory: ${ASSET_STORAGE_DIRECTORY:./data/assets}
    max-pixels: 20000000
    max-dimension: 10000
