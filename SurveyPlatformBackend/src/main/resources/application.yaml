spring:
  application:
    name: SurveyPlatformBackend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 5MB
      # Allow multipart framing overhead beyond the single-file limit.
      max-request-size: 6MB

security:
  jwt:
    secret: ${JWT_SECRET}

turnstile:
  secret: ${TURNSTILE_SECRET:}

app:
  exports:
    # Keep private ZIP artifacts outside static web resources.
    storage-directory: ${EXPORT_STORAGE_DIRECTORY:./data/exports}
    # Completed downloads expire after this duration.
    retention: ${EXPORT_RETENTION:24h}
    # Disable only when another application instance is processing shared tasks.
    scheduler-enabled: ${EXPORT_SCHEDULER_ENABLED:true}
    # Scan durable jobs and cleanup tasks on the dedicated export scheduler.
    scan-interval: ${EXPORT_SCAN_INTERVAL:2s}
  participant-base-url: ${APP_PARTICIPANT_BASE_URL:http://localhost:5173}
  participation:
    inactivity-timeout: ${PARTICIPANT_INACTIVITY_TIMEOUT:30m}
    timeout-scan-interval: ${PARTICIPANT_TIMEOUT_SCAN_INTERVAL:1m}
    timeout-scheduler-enabled: ${PARTICIPANT_TIMEOUT_SCHEDULER_ENABLED:true}
    max-device-info-bytes: ${PARTICIPANT_MAX_DEVICE_INFO_BYTES:4096}
    consent-document-version: ${PARTICIPANT_CONSENT_DOCUMENT_VERSION:platform-default-v1}
  eye-tracking:
    max-gaze-events-per-batch: ${EYE_TRACKING_MAX_GAZE_EVENTS_PER_BATCH:1000}
    max-gaze-payload-chars: ${EYE_TRACKING_MAX_GAZE_PAYLOAD_CHARS:2000000}
    max-calibration-attempts-per-session: ${EYE_TRACKING_MAX_CALIBRATION_ATTEMPTS_PER_SESSION:20}
  assets:
    storage-directory: ${ASSET_STORAGE_DIRECTORY:./data/assets}
    max-pixels: 20000000
    max-dimension: 10000
    cleanup:
      scheduler-enabled: ${ASSET_CLEANUP_SCHEDULER_ENABLED:true}
      scan-interval: ${ASSET_CLEANUP_SCAN_INTERVAL:30s}
