name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: SurveyPlatformBackend/pom.xml

      - name: Test and build backend
        working-directory: SurveyPlatformBackend
        run: ./mvnw verify

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: SurveyPlatformFrontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: SurveyPlatformFrontend
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: SurveyPlatformFrontend
        run: pnpm lint

      - name: Test frontend
        working-directory: SurveyPlatformFrontend
        run: pnpm test

      - name: Build frontend
        working-directory: SurveyPlatformFrontend
        run: pnpm build