name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: SurveyPlatformBackend/pom.xml

      - name: Run backend tests
        working-directory: SurveyPlatformBackend
        run: ./mvnw test